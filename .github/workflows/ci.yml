name: CI

# Backend merge gate: lint, type-check, migration graph, and the full test
# suite. Runs on every push and pull request. Needs no secrets: the tests use
# temporary SQLite databases and stubbed LLM / SMTP clients, and settings
# fall back to safe defaults when there is no .env.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Lint, type-check & tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Mypy type-check
        run: mypy src/nl_to_sql
      - name: Single Alembic head
        # Two heads means two migrations claim the same parent — upgrade would fail.
        run: test "$(alembic heads | wc -l)" -eq 1
      - name: Pytest
        env:
          APP_ENV: development
        run: pytest -p no:cacheprovider
